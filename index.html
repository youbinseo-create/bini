<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>카드 놀이터 - 카드 뒤집기</title>
<style>
  :root {
    --ink: #18202f;
    --muted: #687385;
    --paper: #fffdf7;
    --line: #d9deea;
    --blue: #2b6fd6;
    --teal: #168b8f;
    --coral: #ef6a5b;
    --green: #4f8f46;
    --gold: #c98713;
    --card-back: #25304a;
    --shadow: 0 14px 34px rgba(27, 35, 52, 0.14);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    color: var(--ink);
    background:
      radial-gradient(circle at 15% 12%, rgba(239, 106, 91, 0.13), transparent 28%),
      radial-gradient(circle at 80% 4%, rgba(22, 139, 143, 0.14), transparent 28%),
      linear-gradient(135deg, #f8fbff 0%, #fff8ed 100%);
    font-family: "Segoe UI", "Malgun Gothic", Arial, sans-serif;
    min-height: 100vh;
  }

  button, input {
    font: inherit;
  }

  button {
    border: 0;
    cursor: pointer;
  }

  .app {
    width: min(1180px, 100%);
    margin: 0 auto;
    padding: 24px;
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    margin-bottom: 18px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-mark {
    width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
    border-radius: 8px;
    background: #fff;
    box-shadow: var(--shadow);
    font-size: 28px;
  }

  h1 {
    margin: 0;
    font-size: clamp(24px, 4vw, 40px);
    letter-spacing: 0;
  }

  .subtitle {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 15px;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 36px;
    padding: 8px 12px;
    border-radius: 999px;
    background: #ffffffc9;
    border: 1px solid var(--line);
    color: #455065;
    font-weight: 700;
    white-space: nowrap;
  }

  .layout {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 18px;
    align-items: start;
  }

  .panel, .game-area {
    background: rgba(255, 255, 255, 0.92);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: var(--shadow);
  }

  .panel {
    padding: 18px;
  }

  .section-title {
    margin: 0 0 10px;
    font-size: 17px;
  }

  .deck-list, .difficulty-list {
    display: grid;
    gap: 8px;
    margin-bottom: 18px;
  }

  .option {
    min-height: 48px;
    display: grid;
    grid-template-columns: 36px 1fr auto;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 8px 10px;
    border-radius: 8px;
    background: #f7f9fd;
    border: 1px solid transparent;
    text-align: left;
    color: var(--ink);
  }

  .option strong {
    display: block;
    font-size: 14px;
  }

  .option span {
    display: block;
    color: var(--muted);
    font-size: 12px;
    margin-top: 2px;
  }

  .option[aria-pressed="true"] {
    background: #edf6f6;
    border-color: var(--teal);
    box-shadow: inset 0 0 0 1px var(--teal);
  }

  .option-icon {
    width: 36px;
    height: 36px;
    display: grid;
    place-items: center;
    border-radius: 8px;
    background: #fff;
    font-size: 22px;
  }

  .tag {
    padding: 5px 8px;
    border-radius: 999px;
    background: #fff;
    color: #4e5b70;
    font-size: 12px;
    font-weight: 800;
  }

  .difficulty-list {
    grid-template-columns: repeat(2, 1fr);
  }

  .difficulty {
    min-height: 48px;
    padding: 8px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    font-weight: 800;
  }

  .difficulty[aria-pressed="true"] {
    color: #fff;
    background: var(--blue);
    border-color: var(--blue);
  }

  .photo-box {
    display: grid;
    gap: 8px;
    margin-bottom: 16px;
    padding: 12px;
    border-radius: 8px;
    background: #fff8e8;
    border: 1px solid #f0d6a5;
  }

  .photo-box label {
    display: grid;
    gap: 5px;
    color: #604312;
    font-size: 13px;
    font-weight: 800;
  }

  input[type="file"] {
    width: 100%;
    min-height: 42px;
    padding: 9px;
    border: 1px dashed #c99f4b;
    border-radius: 8px;
    background: #fff;
  }

  .start {
    width: 100%;
    min-height: 52px;
    border-radius: 8px;
    color: #fff;
    background: var(--coral);
    font-size: 18px;
    font-weight: 900;
    box-shadow: 0 10px 18px rgba(239, 106, 91, 0.28);
  }

  .hint {
    margin: 10px 0 0;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.45;
  }

  .game-area {
    min-height: 690px;
    padding: 18px;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(4, minmax(90px, 1fr));
    gap: 10px;
    margin-bottom: 14px;
  }

  .stat {
    min-height: 62px;
    padding: 10px;
    border-radius: 8px;
    background: #f5f7fb;
    border: 1px solid var(--line);
  }

  .stat b {
    display: block;
    font-size: 20px;
  }

  .stat span {
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
  }

  .board {
    display: grid;
    gap: 8px;
    align-items: stretch;
  }

  .board[data-size="12"] { grid-template-columns: repeat(4, 1fr); }
  .board[data-size="16"] { grid-template-columns: repeat(4, 1fr); }
  .board[data-size="24"] { grid-template-columns: repeat(6, 1fr); }
  .board[data-size="50"] { grid-template-columns: repeat(10, 1fr); }

  .card {
    position: relative;
    min-width: 0;
    aspect-ratio: 3 / 4;
    border-radius: 8px;
    background: transparent;
    perspective: 900px;
  }

  .card[disabled] {
    cursor: default;
  }

  .card-inner {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    transition: transform 0.42s ease;
  }

  .card.flipped .card-inner,
  .card.matched .card-inner {
    transform: rotateY(180deg);
  }

  .card-face {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    backface-visibility: hidden;
    border-radius: 8px;
    overflow: hidden;
  }

  .card-back {
    background:
      linear-gradient(145deg, rgba(255,255,255,0.12), transparent),
      var(--card-back);
    border: 2px solid #3a496c;
    color: #fff;
    font-size: clamp(20px, 4vw, 42px);
  }

  .card-back img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .card-front {
    transform: rotateY(180deg);
    background: #fff;
    border: 2px solid #dce2ed;
    padding: 8px;
    grid-template-rows: 1fr auto auto;
    text-align: center;
  }

  .visual {
    width: 100%;
    min-height: 0;
    display: grid;
    place-items: center;
    border-radius: 7px;
    background: #eef4fb;
    overflow: hidden;
  }

  .visual img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .card-name {
    width: 100%;
    margin-top: 6px;
    font-size: clamp(11px, 1.8vw, 15px);
    font-weight: 900;
    color: var(--ink);
    line-height: 1.12;
    overflow-wrap: anywhere;
  }

  .card-desc {
    width: 100%;
    margin-top: 3px;
    color: var(--muted);
    font-size: clamp(8px, 1.4vw, 11px);
    line-height: 1.2;
    overflow-wrap: anywhere;
  }

  .board[data-size="50"] .card-front {
    padding: 4px;
  }

  .board[data-size="50"] .card-desc {
    display: none;
  }

  .board[data-size="50"] .card-name {
    font-size: 10px;
  }

  .empty-state {
    min-height: 540px;
    display: grid;
    place-items: center;
    text-align: center;
    color: var(--muted);
    border: 2px dashed #ccd4e2;
    border-radius: 8px;
    background: #fbfcff;
    padding: 30px;
  }

  .empty-state strong {
    display: block;
    margin-bottom: 8px;
    color: var(--ink);
    font-size: 26px;
  }

  .result {
    position: fixed;
    inset: 0;
    display: none;
    place-items: center;
    padding: 24px;
    background: rgba(18, 25, 39, 0.46);
    z-index: 20;
  }

  .result.show {
    display: grid;
  }

  .result-card {
    width: min(420px, 100%);
    padding: 24px;
    border-radius: 8px;
    background: #fff;
    box-shadow: var(--shadow);
    text-align: center;
  }

  .result-card h2 {
    margin: 0 0 10px;
    font-size: 28px;
  }

  .result-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin: 16px 0;
  }

  .secondary {
    min-height: 46px;
    padding: 10px 14px;
    border-radius: 8px;
    background: #edf1f7;
    color: var(--ink);
    font-weight: 900;
  }

  @media (max-width: 920px) {
    .layout {
      grid-template-columns: 1fr;
    }

    .panel {
      order: 1;
    }

    .game-area {
      order: 2;
      min-height: 0;
    }

    .deck-list {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media (max-width: 640px) {
    .app {
      padding: 14px;
    }

    .topbar {
      align-items: flex-start;
      flex-direction: column;
    }

    .deck-list {
      grid-template-columns: 1fr;
    }

    .stats {
      grid-template-columns: repeat(2, 1fr);
    }

    .board[data-size="12"],
    .board[data-size="16"] {
      grid-template-columns: repeat(4, 1fr);
    }

    .board[data-size="24"] {
      grid-template-columns: repeat(4, 1fr);
    }

    .board[data-size="50"] {
      grid-template-columns: repeat(5, 1fr);
    }

    .card-front {
      padding: 5px;
    }

    .card-desc {
      display: none;
    }
  }
</style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">🃏</div>
        <div>
          <h1>카드 놀이터</h1>
          <p class="subtitle">카드 뒤집기로 시작하는 작은 학습 게임 앱</p>
        </div>
      </div>
      <div class="pill">오늘의 게임: 카드 뒤집기</div>
    </header>

    <div class="layout">
      <aside class="panel" aria-label="게임 설정">
        <h2 class="section-title">기본 덱</h2>
        <div class="deck-list" id="deckList"></div>

        <h2 class="section-title">난이도</h2>
        <div class="difficulty-list" id="difficultyList"></div>

        <div class="photo-box">
          <label>
            내 사진 덱
            <input id="photoInput" type="file" accept="image/*" multiple>
          </label>
          <p class="hint" id="photoHint">사진을 고르면 현재 난이도에 맞춰 나만의 카드가 만들어져요.</p>
        </div>

        <button class="start" id="startBtn" type="button">게임 시작</button>
        <p class="hint">50장 모드는 카드가 작아져서 이름 위주로 보여요. 아이와 처음 할 때는 12장이나 16장을 추천해요.</p>
      </aside>

      <section class="game-area" aria-label="카드 뒤집기 게임판">
        <div class="stats">
          <div class="stat"><b id="timeStat">0:00</b><span>시간</span></div>
          <div class="stat"><b id="moveStat">0</b><span>뒤집은 횟수</span></div>
          <div class="stat"><b id="matchStat">0/6</b><span>맞춘 쌍</span></div>
          <div class="stat"><b id="deckStat">우주</b><span>선택 덱</span></div>
        </div>

        <div id="board" class="board" data-size="12">
          <div class="empty-state">
            <div>
              <strong>덱과 난이도를 고르고 시작해요</strong>
              우주, 상어, 멸종 위기 동물, 세계 대표 음식 중 하나를 골라보세요.
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <div class="result" id="resultModal" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
    <div class="result-card">
      <h2 id="resultTitle">성공!</h2>
      <p id="resultText">모든 카드를 맞췄어요.</p>
      <div class="result-grid">
        <div class="stat"><b id="finalTime">0:00</b><span>완료 시간</span></div>
        <div class="stat"><b id="finalMoves">0</b><span>뒤집은 횟수</span></div>
      </div>
      <button class="start" id="againBtn" type="button">다시 하기</button>
      <button class="secondary" id="closeResultBtn" type="button">설정 바꾸기</button>
    </div>
  </div>

function renderDeckOptions() {
  const builtIn = Object.entries(decks).map(([key, deck]) => `
    <button class="option" type="button" data-deck="${key}" aria-pressed="${selectedDeck === key}">
      <span class="option-icon">${deck.icon}</span>
      <span><strong>${deck.title}</strong><span>${deck.note}</span></span>
      <span class="tag">${deck.items.length}</span>
    </button>
  `).join("");

  const custom = `
    <button class="option" type="button" data-deck="custom" aria-pressed="${selectedDeck === "custom"}">
      <span class="option-icon">🖼️</span>
      <span><strong>내 사진</strong><span>사진첩에서 고른 카드</span></span>
      <span class="tag">${customItems.length}</span>
    </button>
  `;

  deckList.innerHTML = builtIn + custom;
  deckList.querySelectorAll("button").forEach(button => {
    button.addEventListener("click", () => {
      selectedDeck = button.dataset.deck;
      renderDeckOptions();
      updateDeckStat();
    });
  });
}

function renderDifficultyOptions() {
  difficultyList.innerHTML = difficulties.map(difficulty => `
    <button class="difficulty" type="button" data-cards="${difficulty.cards}" aria-pressed="${selectedCards === difficulty.cards}">
      ${difficulty.label}<br><small>${difficulty.pairs}쌍</small>
    </button>
  `).join("");

  difficultyList.querySelectorAll("button").forEach(button => {
    button.addEventListener("click", () => {
      selectedCards = Number(button.dataset.cards);
      renderDifficultyOptions();
      matchStat.textContent = `0/${selectedCards / 2}`;
      board.dataset.size = selectedCards;
    });
  });
}

function getActiveDeckTitle() {
  return selectedDeck === "custom" ? "내 사진" : decks[selectedDeck].title;
}

function updateDeckStat() {
  deckStat.textContent = getActiveDeckTitle();
}

function sampleItems() {
  const pairCount = selectedCards / 2;
  const source = selectedDeck === "custom" ? customItems : decks[selectedDeck].items.map(([visual, name, desc]) => ({
    visual,
    name,
    desc,
    deck: selectedDeck,
    src: assetPath(selectedDeck, name)
  }));

  if (source.length < pairCount) {
    alert(`이 난이도는 ${pairCount}장의 서로 다른 카드가 필요해요. 지금 덱에는 ${source.length}장만 있어요.`);
    return null;
  }

  return shuffle([...source]).slice(0, pairCount);
}

function colorFromName(name, palette) {
  let total = 0;
  for (let i = 0; i < name.length; i++) total += name.charCodeAt(i) * (i + 3);
  return palette[total % palette.length];
}

function makeArtwork(card, index) {
  const label = escapeSvg(card.name);
  const base = colorFromName(card.name, ["#2b6fd6", "#168b8f", "#ef6a5b", "#4f8f46", "#c98713", "#7b5ac9"]);
  const accent = colorFromName(card.name + "x", ["#ffe08a", "#9be7df", "#ffb4a8", "#b7df89", "#b8ccff", "#f7b4d7"]);
  const seed = (index % 7) + 1;

  if (card.deck === "space") return spaceArt(label, base, accent, seed);
  if (card.deck === "sharks") return sharkArt(label, base, accent, seed);
  if (card.deck === "endangered") return animalArt(label, base, accent, seed);
  if (card.deck === "food") return foodArt(label, base, accent, seed);
  return genericArt(label, base, accent, seed);
}

function svgShell(bg1, bg2, body) {
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" role="img">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="${bg1}"/>
        <stop offset="1" stop-color="${bg2}"/>

      <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0e1b2f" flood-opacity=".18"/>
      </filter>
    </defs>
    <rect width="360" height="260" rx="24" fill="url(#bg)"/>
    ${body}
  </svg>`;
}

function escapeSvg(text) {
  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

  const items = sampleItems();

  stopTimer();
  resultModal.classList.remove("show");
  moves = 0;
  matchedPairs = 0;
  flipped = [];
  locked = false;
  cards = shuffle([...items, ...items].map((item, index) => ({
    ...item,
    uid: `${item.name}-${index}`,
    pairKey: item.name,
    matched: false
  })));

  moveStat.textContent = "0";
  matchStat.textContent = `0/${selectedCards / 2}`;
  timeStat.textContent = "0:00";
  updateDeckStat();
  board.dataset.size = selectedCards;
  renderBoard();
  startedAt = Date.now();
  timer = setInterval(updateTimer, 1000);
}

function renderBoard() {
  const back = selectedDeck === "custom" ? "🖼️" : decks[selectedDeck].back;
  const backImage = backAssetPath();
  board.innerHTML = cards.map((card, index) => `
    <button class="card ${card.matched ? "matched" : ""}" type="button" data-index="${index}" aria-label="${card.name} 카드">
      <span class="card-inner">
        <span class="card-face card-back">${backImage ? `<img src="${backImage}" alt="" onerror="this.remove(); this.parentElement.textContent='${back}'">` : back}</span>
        <span class="card-face card-front">
          <span class="visual"><img src="${artworkUrl(card, index)}" alt="" onerror="this.src='${fallbackArtworkUrl(card, index)}'"></span>
          <span class="card-name">${card.name}</span>
          <span class="card-desc">${card.desc}</span>
        </span>
      </span>
    </button>
  `).join("");

  board.querySelectorAll(".card").forEach(button => {
    button.addEventListener("click", () => flipCard(button));
  });
}

function fallbackArtworkUrl(card, index) {
  const svg = makeArtwork({ ...card, src: "" }, index);
  return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
}

function flipCard(button) {
  if (locked) return;
  const index = Number(button.dataset.index);
  const card = cards[index];
  if (!card || card.matched || button.classList.contains("flipped")) return;

  button.classList.add("flipped");
  flipped.push({ index, button });

  if (flipped.length === 2) {
    moves += 1;
    moveStat.textContent = moves;
    checkMatch();
  }
}

function checkMatch() {
  const [first, second] = flipped;
  locked = true;

  if (cards[first.index].pairKey === cards[second.index].pairKey) {
    cards[first.index].matched = true;
    cards[second.index].matched = true;
    first.button.classList.add("matched");
    second.button.classList.add("matched");
    matchedPairs += 1;
    matchStat.textContent = `${matchedPairs}/${selectedCards / 2}`;
    flipped = [];
    locked = false;

    if (matchedPairs === selectedCards / 2) {
      finishGame();
    }
    return;
  }

  setTimeout(() => {
    first.button.classList.remove("flipped");
    second.button.classList.remove("flipped");
    flipped = [];
    locked = false;
  }, 800);
}

function finishGame() {
  stopTimer();
  finalTime.textContent = timeStat.textContent;
  finalMoves.textContent = moves;
  resultModal.classList.add("show");
}

function updateTimer() {
  const seconds = Math.floor((Date.now() - startedAt) / 1000);
  timeStat.textContent = formatTime(seconds);
}

function formatTime(seconds) {
  const mins = Math.floor(seconds / 60);
  const secs = String(seconds % 60).padStart(2, "0");
  return `${mins}:${secs}`;
}

function stopTimer() {
  if (timer) clearInterval(timer);
  timer = null;
}

function shuffle(list) {
  const arr = [...list];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

photoInput.addEventListener("change", event => {
  const files = Array.from(event.target.files || []).filter(file => file.type.startsWith("image/"));
  customItems.forEach(item => URL.revokeObjectURL(item.src));
  customItems = files.map((file, index) => ({
    src: URL.createObjectURL(file),
    visual: "🖼️",
    name: file.name.replace(/\.[^.]+$/, "").slice(0, 18) || `사진 ${index + 1}`,
    desc: "내 사진첩에서 고른 카드예요."
  }));
  photoHint.textContent = customItems.length ? `${customItems.length}장의 사진을 불러왔어요.` : "사진을 고르면 현재 난이도에 맞춰 나만의 카드가 만들어져요.";
  selectedDeck = "custom";
  renderDeckOptions();
  updateDeckStat();
});

startBtn.addEventListener("click", startGame);
againBtn.addEventListener("click", startGame);
closeResultBtn.addEventListener("click", () => resultModal.classList.remove("show"));

renderDeckOptions();
renderDifficultyOptions();
updateDeckStat();
matchStat.textContent = `0/${selectedCards / 2}`;
</script>
</body>
</html>
