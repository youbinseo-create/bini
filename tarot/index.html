<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘의 결 카드</title>
  <style>
    :root {
      --ink: #17120f;
      --night: #211916;
      --coal: #30251f;
      --paper: #f8efe1;
      --paper-soft: rgba(255, 248, 235, 0.88);
      --muted: #9f8c76;
      --gold: #d4ad5a;
      --red: #9b443b;
      --jade: #456f60;
      --line: rgba(247, 226, 182, 0.24);
      --dark-line: rgba(45, 34, 26, 0.16);
      --shadow: 0 24px 60px rgba(18, 12, 8, 0.34);
      --result-card-width: 220px;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--ink);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--paper);
      background:
        linear-gradient(120deg, rgba(155, 68, 59, 0.22), transparent 32%),
        linear-gradient(240deg, rgba(69, 111, 96, 0.24), transparent 38%),
        repeating-linear-gradient(90deg, rgba(255, 238, 194, 0.035) 0 1px, transparent 1px 64px),
        var(--ink);
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      width: min(1160px, calc(100% - 32px));
      margin: 0 auto;
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .brand {
      min-width: 0;
    }

    .brand strong {
      display: block;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 24px;
      line-height: 1;
      color: var(--paper);
    }

    .brand span {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .ghost-button,
    .solid-button,
    .icon-button,
    .spread-button {
      min-height: 42px;
      border-radius: 8px;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease, border-color 0.18s ease;
    }

    .ghost-button,
    .icon-button,
    .spread-button {
      background: rgba(248, 239, 225, 0.08);
      border: 1px solid var(--line);
      color: var(--paper);
    }

    .ghost-button,
    .solid-button,
    .spread-button {
      padding: 0 16px;
    }

    .icon-button {
      width: 42px;
      display: grid;
      place-items: center;
    }

    .solid-button {
      color: var(--ink);
      background: var(--gold);
      box-shadow: 0 12px 24px rgba(212, 173, 90, 0.2);
      font-weight: 900;
    }

    .spread-button[aria-pressed="true"] {
      color: var(--ink);
      background: var(--paper);
      border-color: transparent;
      font-weight: 900;
    }

    .ghost-button:hover,
    .solid-button:hover,
    .icon-button:hover,
    .spread-button:hover,
    .deck-choice:hover,
    .small-card:hover {
      transform: translateY(-2px);
    }

    .scene {
      width: min(1160px, calc(100% - 32px));
      margin: 0 auto;
      flex: 1;
      display: grid;
      align-items: center;
      padding: 22px 0 46px;
    }

    .stage {
      display: none;
    }

    .stage.is-active {
      display: grid;
      animation: rise 0.34s ease both;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .intro {
      grid-template-columns: minmax(280px, 0.92fr) minmax(260px, 1.08fr);
      gap: clamp(26px, 5vw, 72px);
      align-items: center;
      min-height: calc(100vh - 140px);
    }

    .intro-copy {
      display: grid;
      gap: 18px;
    }

    .eyebrow {
      color: var(--gold);
      font-size: 13px;
      font-weight: 900;
    }

    h1 {
      margin: 0;
      max-width: 720px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(46px, 7vw, 88px);
      line-height: 0.96;
      letter-spacing: 0;
    }

    .lead {
      max-width: 620px;
      margin: 0;
      color: #ddceba;
      font-size: clamp(17px, 2vw, 22px);
      line-height: 1.7;
      word-break: keep-all;
    }

    .question-strip {
      display: grid;
      grid-template-columns: 180px 1fr;
      gap: 10px;
      max-width: 680px;
      margin-top: 6px;
    }

    .question-strip select,
    .question-strip input {
      width: 100%;
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--paper);
      background: rgba(248, 239, 225, 0.08);
      padding: 0 13px;
      outline: none;
    }

    .question-strip input::placeholder {
      color: rgba(248, 239, 225, 0.42);
    }

    .question-strip select:focus,
    .question-strip input:focus {
      border-color: rgba(212, 173, 90, 0.78);
      box-shadow: 0 0 0 3px rgba(212, 173, 90, 0.14);
    }

    .spread-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }

    .intro-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 4px;
    }

    .altar {
      position: relative;
      min-height: 560px;
      display: grid;
      place-items: center;
    }

    .altar::before {
      content: "";
      position: absolute;
      width: min(520px, 92%);
      aspect-ratio: 1;
      border: 1px solid rgba(212, 173, 90, 0.36);
      transform: rotate(45deg);
    }

    .altar::after {
      content: "";
      position: absolute;
      width: min(420px, 78%);
      aspect-ratio: 1;
      border: 1px solid rgba(248, 239, 225, 0.16);
      transform: rotate(45deg);
    }

    .deck-stack {
      position: relative;
      width: min(260px, 72vw);
      aspect-ratio: 7 / 12;
      z-index: 1;
    }

    .deck-back {
      position: absolute;
      inset: 0;
      border-radius: 10px;
      border: 1px solid rgba(255, 236, 180, 0.64);
      background:
        linear-gradient(145deg, rgba(255, 248, 224, 0.14), transparent 24%),
        repeating-linear-gradient(45deg, rgba(212, 173, 90, 0.14) 0 2px, transparent 2px 15px),
        linear-gradient(160deg, #312019, #5a3027 52%, #294b3f);
      box-shadow: var(--shadow);
    }

    .deck-back:nth-child(1) {
      transform: rotate(-7deg) translate(-12px, 10px);
    }

    .deck-back:nth-child(2) {
      transform: rotate(3deg) translate(7px, 4px);
    }

    .deck-back:nth-child(3) {
      transform: rotate(-1deg);
    }

    .deck-back::before {
      content: "";
      position: absolute;
      inset: 18px;
      border: 1px solid rgba(255, 236, 180, 0.72);
      border-radius: 7px;
    }

    .deck-back::after {
      content: "命";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: rgba(255, 236, 180, 0.88);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 68px;
    }

    .choose {
      gap: 22px;
      align-content: start;
      padding: 18px 0 30px;
    }

    .reading-head {
      display: grid;
      gap: 10px;
      max-width: 820px;
    }

    .reading-head h2 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(34px, 5vw, 58px);
      line-height: 1;
    }

    .reading-head p {
      margin: 0;
      color: #d9c8b3;
      line-height: 1.7;
      word-break: keep-all;
    }

    .choice-status {
      color: var(--gold);
      font-weight: 900;
    }

    .deck-grid {
      display: grid;
      grid-template-columns: repeat(9, minmax(68px, 1fr));
      gap: clamp(8px, 1.4vw, 14px);
      align-items: stretch;
    }

    .deck-choice {
      position: relative;
      aspect-ratio: 7 / 12;
      border-radius: 9px;
      border: 1px solid rgba(248, 239, 225, 0.24);
      background:
        linear-gradient(145deg, rgba(255, 248, 224, 0.12), transparent 26%),
        repeating-linear-gradient(45deg, rgba(212, 173, 90, 0.13) 0 2px, transparent 2px 13px),
        linear-gradient(160deg, #2a1d18, #63352b 54%, #2f574a);
      box-shadow: 0 12px 28px rgba(17, 12, 8, 0.22);
      color: rgba(255, 236, 180, 0.86);
      transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
      min-width: 0;
    }

    .deck-choice::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(255, 236, 180, 0.58);
      border-radius: 6px;
    }

    .deck-choice::after {
      content: "選";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(24px, 4vw, 46px);
    }

    .deck-choice.is-picked {
      opacity: 0.45;
      transform: translateY(8px) scale(0.96);
      pointer-events: none;
    }

    .result {
      gap: 20px;
      padding: 18px 0 40px;
      align-content: start;
    }

    .result-top {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .result-title {
      display: grid;
      gap: 8px;
    }

    .result-title h2 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(36px, 5vw, 64px);
      line-height: 1;
    }

    .result-title p {
      margin: 0;
      color: #d9c8b3;
      line-height: 1.6;
    }

    .spread-result {
      display: grid;
      grid-template-columns: repeat(var(--result-columns), minmax(0, var(--result-card-width)));
      gap: 16px;
      align-items: start;
      justify-content: center;
    }

    .reading-card {
      display: grid;
      gap: 12px;
      min-width: 0;
      width: min(100%, var(--result-card-width));
      animation: flipIn 0.55s ease both;
      animation-delay: calc(var(--delay) * 90ms);
    }

    @keyframes flipIn {
      from {
        opacity: 0;
        transform: rotateY(28deg) translateY(16px);
      }
      to {
        opacity: 1;
        transform: rotateY(0) translateY(0);
      }
    }

    .card-face {
      position: relative;
      width: 100%;
      aspect-ratio: 7 / 12;
      overflow: hidden;
      border-radius: 10px;
      border: 1px solid rgba(255, 236, 180, 0.42);
      background:
        linear-gradient(180deg, rgba(255, 248, 224, 0.16), transparent 34%),
        linear-gradient(145deg, #27372f, #7b3d34 54%, #d4ad5a);
      box-shadow: 0 18px 34px rgba(18, 12, 8, 0.28);
    }

    .card-face img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-face[data-has-image="false"] img {
      display: none;
    }

    .frame {
      position: absolute;
      inset: 12px;
      border: 1px solid rgba(255, 236, 180, 0.76);
      border-radius: 7px;
      pointer-events: none;
    }

    .fallback {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      color: #fff6df;
    }

    .card-face[data-has-image="true"] .fallback {
      display: none;
    }

    .fallback-rank {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(42px, 8vw, 74px);
      line-height: 0.9;
    }

    .fallback-person {
      margin-top: 16px;
      font-weight: 900;
      font-size: 20px;
      word-break: keep-all;
    }

    .card-copy {
      display: grid;
      gap: 8px;
    }

    .position {
      color: var(--gold);
      font-size: 13px;
      font-weight: 900;
    }

    .card-name {
      color: var(--paper);
      font-size: 22px;
      font-weight: 900;
      line-height: 1.2;
      word-break: keep-all;
    }

    .card-sub {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .keywords {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .keyword {
      display: inline-flex;
      align-items: center;
      min-height: 27px;
      padding: 0 9px;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: #e9dccb;
      background: rgba(248, 239, 225, 0.06);
      font-size: 12px;
    }

    .advice {
      margin: 0;
      color: #e4d4c0;
      line-height: 1.7;
      word-break: keep-all;
    }

    .reading-text {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-top: 2px;
    }

    .oracle,
    .action-note {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(248, 239, 225, 0.08);
      padding: 18px;
    }

    .oracle h3,
    .action-note h3 {
      margin: 0 0 8px;
      color: var(--gold);
      font-size: 15px;
    }

    .oracle p,
    .action-note p {
      margin: 0;
      color: #e4d4c0;
      line-height: 1.75;
      word-break: keep-all;
    }

    .library {
      display: none;
      width: min(1160px, calc(100% - 32px));
      margin: 0 auto 46px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .library.is-open {
      display: grid;
      gap: 14px;
    }

    .library-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .library h2 {
      margin: 0;
      font-size: 22px;
    }

    .library h2::after {
      content: " · 상징 읽기";
      color: var(--muted);
      font-weight: 500;
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filters input,
    .filters select {
      min-height: 40px;
      border-radius: 8px;
      border: 1px solid var(--line);
      color: var(--paper);
      background: rgba(248, 239, 225, 0.08);
      padding: 0 12px;
      outline: none;
    }

    .filters input::placeholder {
      color: rgba(248, 239, 225, 0.42);
    }

    .small-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
    }

    .small-card {
      min-height: 128px;
      display: grid;
      gap: 6px;
      align-content: start;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      color: var(--paper);
      background: rgba(248, 239, 225, 0.07);
      text-align: left;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .small-card small {
      color: var(--muted);
      line-height: 1.35;
    }

    .small-card strong {
      font-size: 16px;
      line-height: 1.25;
      word-break: keep-all;
    }

    .small-card span {
      color: #d9c8b3;
      font-size: 13px;
      line-height: 1.45;
    }

    .empty {
      min-height: 220px;
      display: grid;
      place-items: center;
      color: var(--muted);
      text-align: center;
      line-height: 1.7;
      padding: 20px;
    }

    @media (max-width: 920px) {
      :root {
        --result-card-width: 210px;
      }

      .intro {
        grid-template-columns: 1fr;
        min-height: auto;
      }

      .altar {
        min-height: 420px;
        order: -1;
      }

      .deck-grid {
        grid-template-columns: repeat(6, minmax(48px, 1fr));
      }

      .spread-result {
        grid-template-columns: repeat(auto-fit, minmax(min(210px, 100%), var(--result-card-width)));
      }

      .reading-text {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 680px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
        padding: 14px 0;
      }

      .scene,
      .topbar,
      .library {
        width: min(100% - 22px, 1160px);
      }

      .question-strip {
        grid-template-columns: 1fr;
      }

      .deck-grid {
        grid-template-columns: repeat(4, minmax(52px, 1fr));
      }

      .spread-result {
        grid-template-columns: 1fr;
      }

      .reading-card {
        grid-template-columns: minmax(96px, 124px) 1fr;
        width: 100%;
        max-width: 560px;
        margin: 0 auto;
      }

      .card-face {
        width: 100%;
      }

      .card-name {
        font-size: 19px;
      }
    }

    @media (max-width: 460px) {
      :root {
        --result-card-width: 210px;
      }

      .reading-card {
        grid-template-columns: 1fr;
        width: min(100%, var(--result-card-width));
      }

      .ghost-button,
      .solid-button,
      .spread-button {
        flex: 1 1 auto;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <strong>오늘의 결 카드</strong>
        <span>Reflective Oracle Cards</span>
      </div>
      <div class="nav-actions">
        <button class="ghost-button" type="button" id="libraryToggle">카드 목록</button>
        <button class="icon-button" type="button" id="restartTop" aria-label="처음으로" title="처음으로">↺</button>
      </div>
    </header>

    <section class="scene" aria-live="polite">
      <section class="stage intro is-active" id="introStage">
        <div class="intro-copy">
          <div class="eyebrow">오늘의 나를 비추는 시간</div>
          <h1>질문을 품고 카드를 펼치세요</h1>
          <p class="lead">카드는 미래를 정하지 않습니다. 다만 지금의 나를 다른 각도에서 비추고, 오늘 붙잡을 태도를 보여줍니다.</p>

          <div class="question-strip">
            <select id="topic" aria-label="질문 주제">
              <option>오늘의 마음</option>
              <option>관계의 거리</option>
              <option>사랑과 태도</option>
              <option>일과 성장</option>
              <option>돈과 안정</option>
              <option>선택의 기로</option>
              <option>회복과 건강</option>
              <option>나의 습관</option>
              <option>오래된 고민</option>
            </select>
            <input id="question" type="text" maxlength="90" placeholder="예: 지금 내가 놓치고 있는 태도는 무엇일까?">
          </div>

          <div class="spread-picker" aria-label="리딩 방식">
            <button class="spread-button" type="button" data-count="1" aria-pressed="true">한 장</button>
            <button class="spread-button" type="button" data-count="3" aria-pressed="false">세 장</button>
          </div>

          <div class="intro-actions">
            <button class="solid-button" type="button" id="startButton">질문으로 들어가기</button>
            <button class="ghost-button" type="button" id="quickDrawButton">오늘의 카드</button>
          </div>
        </div>

        <div class="altar" aria-hidden="true">
          <div class="deck-stack">
            <div class="deck-back"></div>
            <div class="deck-back"></div>
            <div class="deck-back"></div>
          </div>
        </div>
      </section>

      <section class="stage choose" id="chooseStage">
        <div class="reading-head">
          <div class="eyebrow">손끝이 머무는 곳</div>
          <h2>카드를 선택하세요</h2>
          <p><span class="choice-status" id="choiceStatus">1장을 골라주세요.</span> 정답을 맞히기보다, 지금 눈이 머무는 카드를 고릅니다.</p>
        </div>
        <div class="deck-grid" id="deckGrid"></div>
      </section>

      <section class="stage result" id="resultStage">
        <div class="result-top">
          <div class="result-title">
            <div class="eyebrow" id="resultEyebrow">리딩 결과</div>
            <h2 id="resultHeading">오늘의 카드</h2>
            <p id="resultQuestion"></p>
          </div>
          <div class="nav-actions">
            <button class="ghost-button" type="button" id="againButton">다시 비추기</button>
            <button class="solid-button" type="button" id="newQuestionButton">새 질문</button>
          </div>
        </div>

        <div class="spread-result" id="spreadResult" style="--result-columns: 1;"></div>

        <div class="reading-text" id="readingText"></div>
      </section>
    </section>

    <section class="library" id="library">
      <div class="library-head">
        <h2>카드 목록</h2>
        <div class="filters">
          <input id="search" type="search" placeholder="인물, 키워드, 슈트 검색">
          <select id="suitFilter" aria-label="슈트 필터">
            <option value="all">전체</option>
          </select>
        </div>
      </div>
      <div class="small-grid" id="libraryGrid"></div>
    </section>
  </main>

  <script src="cards-data.js"></script>
  <script>
    const imagePath = (card) => `assets/cards/${card.id}.jpg`;
    const topicGuides = {
      "오늘의 마음": "지금의 마음은 해결해야 할 문제가 아니라 먼저 바라봐야 할 신호입니다.",
      "관계의 거리": "관계는 가까움만으로 좋아지지 않습니다. 다가갈 곳과 지켜야 할 거리를 함께 봐야 합니다.",
      "사랑과 태도": "사랑은 감정의 크기보다 태도의 방향에서 드러납니다.",
      "일과 성장": "성장은 더 많이 버티는 일이 아니라, 무엇을 익히고 무엇을 줄일지 고르는 일입니다.",
      "돈과 안정": "안정은 한 번의 큰 선택보다 반복되는 흐름과 습관에서 만들어집니다.",
      "선택의 기로": "선택은 정답 찾기가 아니라 내가 감당할 방향을 분명히 하는 일입니다.",
      "회복과 건강": "회복은 멈춤이 아니라 다시 살 수 있는 리듬을 찾는 과정입니다.",
      "나의 습관": "습관은 의지의 부족보다 환경과 반복의 모양을 보여줍니다.",
      "오래된 고민": "오래된 고민은 답이 없어서가 아니라, 같은 방식으로만 바라봤기 때문에 남아 있을 수 있습니다."
    };
    const positionLabels = {
      1: ["핵심 카드"],
      3: ["흐름", "현재", "다음 선택"]
    };

    let cards = [];
    let deck = [];
    let selectedCount = 1;
    let chosenCards = [];

    const introStage = document.querySelector("#introStage");
    const chooseStage = document.querySelector("#chooseStage");
    const resultStage = document.querySelector("#resultStage");
    const startButton = document.querySelector("#startButton");
    const quickDrawButton = document.querySelector("#quickDrawButton");
    const againButton = document.querySelector("#againButton");
    const newQuestionButton = document.querySelector("#newQuestionButton");
    const restartTop = document.querySelector("#restartTop");
    const topic = document.querySelector("#topic");
    const question = document.querySelector("#question");
    const spreadButtons = [...document.querySelectorAll(".spread-button")];
    const deckGrid = document.querySelector("#deckGrid");
    const choiceStatus = document.querySelector("#choiceStatus");
    const spreadResult = document.querySelector("#spreadResult");
    const readingText = document.querySelector("#readingText");
    const resultEyebrow = document.querySelector("#resultEyebrow");
    const resultHeading = document.querySelector("#resultHeading");
    const resultQuestion = document.querySelector("#resultQuestion");
    const libraryToggle = document.querySelector("#libraryToggle");
    const library = document.querySelector("#library");
    const search = document.querySelector("#search");
    const suitFilter = document.querySelector("#suitFilter");
    const libraryGrid = document.querySelector("#libraryGrid");

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function setStage(name) {
      introStage.classList.toggle("is-active", name === "intro");
      chooseStage.classList.toggle("is-active", name === "choose");
      resultStage.classList.toggle("is-active", name === "result");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function shuffle(items) {
      const copy = [...items];
      for (let index = copy.length - 1; index > 0; index--) {
        const target = Math.floor(Math.random() * (index + 1));
        [copy[index], copy[target]] = [copy[target], copy[index]];
      }
      return copy;
    }

    function updateSpreadButtons() {
      for (const button of spreadButtons) {
        button.setAttribute("aria-pressed", String(Number(button.dataset.count) === selectedCount));
      }
    }

    function prepareDeck() {
      chosenCards = [];
      deck = shuffle(cards);
      deckGrid.innerHTML = deck.slice(0, 18).map((card, index) => `
        <button class="deck-choice" type="button" data-id="${escapeHtml(card.id)}" aria-label="${index + 1}번째 카드"></button>
      `).join("");
      updateChoiceStatus();
      setStage("choose");
    }

    function updateChoiceStatus() {
      const remaining = selectedCount - chosenCards.length;
      choiceStatus.textContent = remaining > 0 ? `${remaining}장을 더 골라주세요.` : "카드를 펼칩니다.";
    }

    function chooseCard(id, button) {
      if (chosenCards.length >= selectedCount) return;
      const card = deck.find((item) => item.id === id);
      if (!card || chosenCards.some((item) => item.id === id)) return;
      chosenCards.push(card);
      button.classList.add("is-picked");
      updateChoiceStatus();
      if (chosenCards.length === selectedCount) {
        window.setTimeout(() => renderResult(chosenCards), 360);
      }
    }

    function quickDraw() {
      chosenCards = shuffle(cards).slice(0, selectedCount);
      renderResult(chosenCards);
    }

    function renderResult(drawn) {
      const labels = positionLabels[drawn.length];
      const topicText = topic.value;
      const asked = question.value.trim();
      spreadResult.style.setProperty("--result-columns", String(drawn.length));
      resultEyebrow.textContent = `${topicText} 성찰`;
      resultHeading.textContent = drawn.length === 1 ? "오늘의 결" : "세 장의 거울";
      resultQuestion.textContent = asked ? `“${asked}”` : "질문을 마음속에 품고 뽑은 카드입니다.";
      spreadResult.innerHTML = drawn.map((card, index) => cardTemplate(card, labels[index], index)).join("");
      readingText.innerHTML = readingTemplate(drawn);
      setStage("result");
    }

    function cardTemplate(card, position, index) {
      const keywords = card.subs.map((word) => `<span class="keyword">${escapeHtml(word)}</span>`).join("");
      return `
        <article class="reading-card" style="--delay: ${index};">
          <div class="card-face" data-has-image="true">
            <img src="${escapeHtml(imagePath(card))}" alt="${escapeHtml(card.person)} 카드 이미지" onerror="this.closest('.card-face').dataset.hasImage='false';">
            <div class="fallback">
              <div>
                <div class="fallback-rank">${escapeHtml(card.rank)}</div>
                <div class="fallback-person">${escapeHtml(card.person)}</div>
              </div>
            </div>
            <div class="frame"></div>
          </div>
          <div class="card-copy">
            <div class="position">${escapeHtml(position)}</div>
            <div class="card-name">${escapeHtml(card.person)} / ${escapeHtml(card.main)}</div>
            <div class="card-sub">${escapeHtml(card.tarot)} · ${escapeHtml(card.suit)}</div>
            <div class="keywords">${keywords}</div>
            <p class="advice">${escapeHtml(card.advice)}</p>
          </div>
        </article>
      `;
    }

    function readingTemplate(drawn) {
      const topicText = topic.value;
      const asked = question.value.trim();
      const finalCard = drawn[drawn.length - 1];
      const first = drawn[0];
      const center = drawn[Math.floor(drawn.length / 2)];
      const questionLine = asked ? `질문 “${escapeHtml(asked)}” 앞에서 ` : "";
      const coreLine = drawn.length === 1
        ? `${questionLine}지금 가장 크게 비치는 결은 ${escapeHtml(first.person)}의 ${escapeHtml(first.main)}입니다.`
        : `${questionLine}${escapeHtml(first.person)}의 ${escapeHtml(first.main)}에서 시작해, ${escapeHtml(center.person)}의 ${escapeHtml(center.main)}을 지나, ${escapeHtml(finalCard.person)}의 ${escapeHtml(finalCard.main)}으로 시선이 모입니다.`;
      const topicGuide = topicGuides[topicText] || "지금의 질문은 정답을 맞히기보다, 내가 어떤 태도로 바라보고 있는지 살피게 합니다.";
      const mirrorLine = `${escapeHtml(topicGuide)} 이 카드는 상황을 단정하지 않고, 지금 내가 취할 수 있는 태도를 먼저 보게 합니다.`;
      const questionPrompt = makeReflectionQuestion(finalCard, topicText);
      const actionPrompt = makeActionPrompt(finalCard);
      return `
        <section class="oracle">
          <h3>핵심 문장</h3>
          <p>${coreLine}</p>
        </section>
        <section class="action-note">
          <h3>카드가 비추는 것</h3>
          <p>${mirrorLine}</p>
        </section>
        <section class="oracle">
          <h3>돌아볼 질문</h3>
          <p>${questionPrompt}</p>
        </section>
        <section class="action-note">
          <h3>오늘의 작은 행동</h3>
          <p>${actionPrompt}</p>
        </section>
      `;
    }

    function makeReflectionQuestion(card, topicText) {
      const main = escapeHtml(card.main);
      const keyword = escapeHtml(card.subs[0] || card.main);
      const topicQuestions = {
        "오늘의 마음": `내 마음은 지금 ${main}을(를) 원하면서도, 어떤 감정을 외면하고 있을까?`,
        "관계의 거리": `이 관계에서 ${keyword}을(를) 지키기 위해 내가 가까워져야 할 곳과 물러서야 할 곳은 어디일까?`,
        "사랑과 태도": `나는 ${main}을(를) 바란다고 말하면서, 실제 태도에서는 무엇을 미루고 있을까?`,
        "일과 성장": `${main}을(를) 키우기 위해 오늘 줄여야 할 일과 시작해야 할 일은 무엇일까?`,
        "돈과 안정": `${keyword}을(를) 만들기 위해 내 돈의 흐름에서 가장 먼저 봐야 할 습관은 무엇일까?`,
        "선택의 기로": `${main}을(를) 선택한다면 내가 감당해야 할 책임은 무엇일까?`,
        "회복과 건강": `${keyword}을(를) 회복하기 위해 지금 몸과 마음이 보내는 작은 신호는 무엇일까?`,
        "나의 습관": `${main}을(를) 방해하거나 돕는 반복은 내 하루 어디에 숨어 있을까?`,
        "오래된 고민": `이 고민을 ${main}의 관점에서 보면, 내가 계속 같은 자리로 돌아오는 이유는 무엇일까?`
      };
      return topicQuestions[topicText] || `나는 지금 ${main}을(를) 어떤 방식으로 받아들이고 있을까?`;
    }

    function makeActionPrompt(card) {
      const main = escapeHtml(card.main);
      const advice = escapeHtml(card.advice);
      return `${advice}. 오늘은 ${main}을(를) 큰 결심으로 증명하려 하지 말고, 10분 안에 끝낼 수 있는 작은 행동 하나로 남겨보세요.`;
    }

    function fillSuitFilter() {
      const suits = [...new Set(cards.map((card) => card.suit))];
      for (const suit of suits) {
        const option = document.createElement("option");
        option.value = suit;
        option.textContent = suit;
        suitFilter.append(option);
      }
    }

    function renderLibrary() {
      const keyword = search.value.trim().toLowerCase();
      const suit = suitFilter.value;
      const filtered = cards.filter((card) => {
        const haystack = [card.person, card.main, card.suit, card.tarot, card.advice, ...card.subs].join(" ").toLowerCase();
        return (suit === "all" || card.suit === suit) && (!keyword || haystack.includes(keyword));
      });

      libraryGrid.innerHTML = filtered.map((card) => `
        <button class="small-card" type="button" data-id="${escapeHtml(card.id)}">
          <small>${escapeHtml(card.id)} · ${escapeHtml(card.suit)}</small>
          <strong>${escapeHtml(card.person)} / ${escapeHtml(card.main)}</strong>
          <span>${card.subs.map(escapeHtml).join(" · ")}</span>
        </button>
      `).join("");
    }

    function readFromLibrary(id) {
      const card = cards.find((item) => item.id === id);
      if (!card) return;
      selectedCount = 1;
      updateSpreadButtons();
      chosenCards = [card];
      renderResult(chosenCards);
    }

    async function boot() {
      try {
        if (Array.isArray(window.TAROT_CARDS)) {
          cards = window.TAROT_CARDS;
        } else {
          const response = await fetch("cards-data.json");
          if (!response.ok) throw new Error("cards-data.json을 불러오지 못했습니다.");
          cards = await response.json();
        }
        fillSuitFilter();
        renderLibrary();
      } catch (error) {
        introStage.innerHTML = `<div class="empty">${escapeHtml(error.message)}<br>cards-data.js 파일이 같은 폴더에 있는지 확인해주세요.</div>`;
      }
    }

    startButton.addEventListener("click", prepareDeck);
    quickDrawButton.addEventListener("click", quickDraw);
    againButton.addEventListener("click", prepareDeck);
    newQuestionButton.addEventListener("click", () => setStage("intro"));
    restartTop.addEventListener("click", () => setStage("intro"));

    spreadButtons.forEach((button) => {
      button.addEventListener("click", () => {
        selectedCount = Number(button.dataset.count);
        updateSpreadButtons();
      });
    });

    deckGrid.addEventListener("click", (event) => {
      const button = event.target.closest("[data-id]");
      if (button) chooseCard(button.dataset.id, button);
    });

    libraryToggle.addEventListener("click", () => {
      library.classList.toggle("is-open");
      libraryToggle.textContent = library.classList.contains("is-open") ? "목록 닫기" : "카드 목록";
    });

    search.addEventListener("input", renderLibrary);
    suitFilter.addEventListener("change", renderLibrary);
    libraryGrid.addEventListener("click", (event) => {
      const button = event.target.closest("[data-id]");
      if (button) readFromLibrary(button.dataset.id);
    });

    boot();
  </script>
</body>
</html>
